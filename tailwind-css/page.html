Spacing:
p-4: padding

m-2: margin

px-6: horizontal padding (left & right)

py-3: vertical padding (top & bottom)
Colors:
bg-red-500: background color

text-white: text color

hover:bg-blue-600: hover background color
Typography:
text-xl, text-2xl, text-4xl: font sizes

font-bold, font-light: font weight

italic, underline, tracking-wide
Layout:
flex, justify-center, items-center

grid, grid-cols-2, gap-4

w-full, max-w-md, h-64 

Mobile-First:
sm = ≥ 640px
md = ≥ 768px
